<button id="go">Enable & Capture</button>
<video id="video" autoplay playsinline muted style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>
<img id="preview" style="width:100%;max-width:420px;border:1px solid #ccc;border-radius:8px;" />

<script>
const go = document.getElementById("go");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");

async function waitForReadyVideo(v) {
  // wait for metadata
  await new Promise(resolve => {
    if (v.readyState >= 1 && v.videoWidth > 0) return resolve();
    v.onloadedmetadata = () => resolve();
  });

  // wait one frame
  await new Promise(r => requestAnimationFrame(r));

  // sometimes iOS needs a tiny delay too
  await new Promise(r => setTimeout(r, 200));
}

go.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" } // front camera
    });

    video.srcObject = stream;
    await waitForReadyVideo(video);

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const img = canvas.toDataURL("image/png");
    preview.src = img;

    stream.getTracks().forEach(t => t.stop());

  } catch (e) {
    alert("Camera failed / permission denied");
    console.error(e);
  }
};
</script>
